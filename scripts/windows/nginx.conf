server {
    listen 8000;
    listen [::]:8000;
    server_name localhost development.localhost;
    root /opt/k3ls/project/bench/sites;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff;
    location /assets/ { try_files $uri =404; }
    location ~ ^/protected/(.*) {
        internal;
        try_files /development.localhost/$1 =404;
    }
    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Frappe-Site-Name development.localhost;
        proxy_pass http://127.0.0.1:9000;
    }
    location / { try_files /development.localhost/public/$uri @web; }
    location @web {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name development.localhost;
        # Private uploads are served by Frappe after its permission check.
        # www-data deliberately cannot read the site's private directory.
        proxy_read_timeout 120;
        proxy_pass http://127.0.0.1:8001;
    }
}
